name: Deploy to DigitalOcean

on:
  push:
    branches: [claude/setup-local-test-website-HYAsM]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install nginx on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq nginx
            systemctl enable nginx
            systemctl start nginx

      - name: Copy site to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          source: "index.html"
          target: /var/www/html/

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          script: systemctl reload nginx

      - name: Install Anthropic SDK and run Claude API test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          envs: ANTHROPIC_API_KEY
          script: |
            pip3 install -q anthropic
            cat > /root/test_claude.py << 'EOF'
            import anthropic, os
            client = anthropic.Anthropic(api_key=os.environ["ANTHROPIC_API_KEY"])
            message = client.messages.create(
                model="claude-opus-4-6",
                max_tokens=256,
                messages=[{"role": "user", "content": "Say hello and introduce yourself in 2 sentences."}]
            )
            print(message.content[0].text)
            EOF
            python3 /root/test_claude.py | tee /root/claude_test_output.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
