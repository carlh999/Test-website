name: Deploy to DigitalOcean

on:
  push:
    branches: [claude/setup-local-test-website-HYAsM]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup server dependencies and config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          envs: ANTHROPIC_API_KEY
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # Install system packages
            apt-get update -qq
            apt-get install -y -qq nginx python3 python3-venv python3-pip

            # App directory + virtualenv (avoids Ubuntu 24.04 PEP 668 restriction)
            mkdir -p /root/research-app/templates
            python3 -m venv /root/research-app/venv
            /root/research-app/venv/bin/pip install -q flask anthropic

            # API key env file (protected)
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > /root/.flask-env
            chmod 600 /root/.flask-env

            # Nginx — proxy to Flask with SSE buffering disabled
            cat > /etc/nginx/sites-available/default << 'NGINX'
server {
    listen 80;
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }
}
NGINX

            # Systemd service using venv Python
            cat > /etc/systemd/system/research-app.service << 'SERVICE'
[Unit]
Description=NEXUS Research Agent Flask App
After=network.target

[Service]
Type=simple
User=root
WorkingDirectory=/root/research-app
EnvironmentFile=/root/.flask-env
ExecStart=/root/research-app/venv/bin/python /root/research-app/app.py
Restart=always
RestartSec=3

[Install]
WantedBy=multi-user.target
SERVICE

            systemctl daemon-reload
            systemctl enable research-app
            systemctl enable nginx
            systemctl start nginx
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Deploy app files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          source: "app.py,templates/,requirements.txt"
          target: /root/research-app/

      - name: Restart services and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            set -e
            systemctl restart research-app
            sleep 3
            systemctl is-active research-app
            systemctl reload nginx
            echo "Deploy complete — app running on port 5000"
