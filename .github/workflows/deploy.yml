name: Deploy to DigitalOcean

on:
  push:
    branches: [claude/setup-local-test-website-HYAsM, claude/fix-deploy-yaml-syntax-RaWmm]

permissions:
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass

      - name: Copy files to server
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "mkdir -p /root/research-app/templates"
          sshpass -e scp -o StrictHostKeyChecking=no deploy/setup.sh root@${{ secrets.DO_HOST }}:/tmp/setup.sh
          sshpass -e scp -o StrictHostKeyChecking=no app.py root@${{ secrets.DO_HOST }}:/root/research-app/app.py
          sshpass -e scp -o StrictHostKeyChecking=no requirements.txt root@${{ secrets.DO_HOST }}:/root/research-app/requirements.txt
          sshpass -e scp -o StrictHostKeyChecking=no templates/index.html root@${{ secrets.DO_HOST }}:/root/research-app/templates/index.html

      - name: Run setup
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "chmod +x /tmp/setup.sh && /tmp/setup.sh '${{ secrets.ANTHROPIC_API_KEY }}'" 2>&1 | tee /tmp/setup-output.txt

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(tail -80 /tmp/setup-output.txt 2>/dev/null || echo "no output captured")
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy log — $(echo ${{ github.sha }} | cut -c1-7)" \
            --body "$(printf '```\n%s\n```' "$BODY")" || true
