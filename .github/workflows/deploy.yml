name: Deploy to DigitalOcean

on:
  push:
    branches: [claude/setup-local-test-website-HYAsM]

permissions:
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup server dependencies and config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          envs: ANTHROPIC_API_KEY
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            echo "==> Installing system packages"
            apt-get update -qq
            apt-get install -y -qq nginx python3

            echo "==> Installing Python packages"
            pip3 install --break-system-packages -q flask anthropic

            echo "==> Creating app directories"
            mkdir -p /root/research-app/templates

            echo "==> Writing API key env file"
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > /root/.flask-env
            chmod 600 /root/.flask-env

            echo "==> Writing nginx config"
            cat > /etc/nginx/sites-available/default << 'NGINX'
server {
    listen 80;
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }
}
NGINX

            echo "==> Writing systemd service"
            cat > /etc/systemd/system/research-app.service << 'SERVICE'
[Unit]
Description=NEXUS Research Agent Flask App
After=network.target

[Service]
Type=simple
User=root
WorkingDirectory=/root/research-app
EnvironmentFile=/root/.flask-env
ExecStart=/usr/bin/python3 /root/research-app/app.py
Restart=always
RestartSec=3

[Install]
WantedBy=multi-user.target
SERVICE

            echo "==> Enabling services"
            systemctl daemon-reload
            systemctl enable research-app
            systemctl enable nginx
            systemctl start nginx || systemctl reload nginx
            echo "==> Setup complete"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Deploy app files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          source: "app.py,templates/,requirements.txt"
          target: /root/research-app/

      - name: Restart services and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            set -e
            echo "==> Restarting Flask app"
            systemctl restart research-app
            sleep 3
            echo "==> Verifying Flask is active"
            systemctl is-active research-app
            echo "==> Reloading nginx"
            systemctl reload nginx
            echo "==> Health check"
            curl -sf http://localhost:5000/ > /dev/null && echo "App responding OK" || echo "WARNING: app not yet responding"

      - name: Report failure as GitHub Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed — ${context.sha.substring(0, 7)}`,
              body: [
                '## Deployment Failed',
                '',
                `**Commit:** \`${context.sha}\``,
                `**Logs:** [View full run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                'Expand the failing step in the run logs to see the exact error.',
              ].join('\n')
            })
