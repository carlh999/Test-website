name: Deploy to DigitalOcean

on:
  push:
    branches: [claude/setup-local-test-website-HYAsM, claude/fix-deploy-yaml-syntax-RaWmm]

permissions:
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass

      - name: Test SSH connection
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "echo SSH_OK && hostname"

      - name: Download Python packages on runner
        run: |
          pip download flask anthropic -d /tmp/packages/
          ls -la /tmp/packages/
          echo "DOWNLOAD_OK"

      - name: Create venv on server
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} \
            "mkdir -p /root/research-app && python3 -m venv /root/research-app/venv && echo VENV_OK"

      - name: Upload packages to server
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -r /tmp/packages/ root@${{ secrets.DO_HOST }}:/tmp/packages/
          echo "UPLOAD_OK"

      - name: Install packages from local files
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} \
            "/root/research-app/venv/bin/pip install --no-index --find-links=/tmp/packages/ flask anthropic && echo PACKAGES_OK"

      - name: Create directories and write API key
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} \
            "mkdir -p /root/research-app/templates && echo 'ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}' > /root/.flask-env && chmod 600 /root/.flask-env && echo DIRS_OK"

      - name: Deploy app files and configs
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no app.py requirements.txt root@${{ secrets.DO_HOST }}:/root/research-app/
          sshpass -e scp -o StrictHostKeyChecking=no -r templates/ root@${{ secrets.DO_HOST }}:/root/research-app/templates/
          sshpass -e scp -o StrictHostKeyChecking=no deploy/nginx.conf root@${{ secrets.DO_HOST }}:/etc/nginx/sites-available/default
          sshpass -e scp -o StrictHostKeyChecking=no deploy/research-app.service root@${{ secrets.DO_HOST }}:/etc/systemd/system/research-app.service
          echo DEPLOY_OK

      - name: Start services
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} \
            "systemctl daemon-reload && systemctl enable research-app && systemctl restart research-app && systemctl reload nginx && sleep 3 && systemctl is-active research-app && echo SERVICES_OK"

      - name: Health check
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} \
            "curl -sf http://localhost:5000/ > /dev/null && echo SITE_IS_LIVE || echo Site_not_responding_yet"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          set +e
          DIAG=$(sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} \
            "echo '=== service ===' && cat /etc/systemd/system/research-app.service && echo '=== ls ===' && ls -la /root/research-app/ && echo '=== venv pip list ===' && /root/research-app/venv/bin/pip list 2>&1 && echo '=== status ===' && systemctl status research-app --no-pager 2>&1 && echo '=== journal ===' && journalctl -u research-app --no-pager -n 20 2>&1" 2>&1) || true
          echo "$DIAG"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy diag — $(echo ${{ github.sha }} | cut -c1-7)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ${DIAG}" || true
