name: Deploy to DigitalOcean

on:
  push:
    branches: [claude/setup-local-test-website-HYAsM, claude/fix-deploy-yaml-syntax-RaWmm]

permissions:
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass

      - name: Test SSH connection
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "echo SSH_OK && hostname"

      - name: Check server DNS and install Python packages
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} bash -c '
            echo "==> Testing DNS..."
            if ! host pypi.org > /dev/null 2>&1 && ! ping -c1 -W3 8.8.8.8 > /dev/null 2>&1; then
              echo "==> No DNS, fixing resolv.conf..."
              echo "nameserver 8.8.8.8" > /etc/resolv.conf
              echo "nameserver 1.1.1.1" >> /etc/resolv.conf
            fi
            echo "==> Installing Python packages..."
            pip3 install --break-system-packages flask anthropic 2>&1
            echo PACKAGES_OK
          '

      - name: Create directories and write API key
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "mkdir -p /root/research-app/templates && echo 'ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}' > /root/.flask-env && chmod 600 /root/.flask-env && echo DIRS_OK"

      - name: Deploy app files and configs
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no app.py requirements.txt root@${{ secrets.DO_HOST }}:/root/research-app/
          sshpass -e scp -o StrictHostKeyChecking=no -r templates/ root@${{ secrets.DO_HOST }}:/root/research-app/templates/
          sshpass -e scp -o StrictHostKeyChecking=no deploy/nginx.conf root@${{ secrets.DO_HOST }}:/etc/nginx/sites-available/default
          sshpass -e scp -o StrictHostKeyChecking=no deploy/research-app.service root@${{ secrets.DO_HOST }}:/etc/systemd/system/research-app.service
          echo DEPLOY_OK

      - name: Start services
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} bash -c '
            systemctl daemon-reload
            systemctl enable research-app
            systemctl restart research-app
            systemctl reload nginx
            sleep 3
            systemctl is-active research-app
          '

      - name: Health check
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "curl -sf http://localhost:5000/ > /dev/null && echo SITE_IS_LIVE || echo Site_not_responding_yet"

      - name: Collect service diagnostics
        if: failure()
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          set +e
          DIAG=$(sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} bash -c '
            echo "=== cat /root/.flask-env (redacted) ==="
            test -f /root/.flask-env && echo "exists, $(wc -c < /root/.flask-env) bytes" || echo "MISSING"
            echo "=== cat /etc/systemd/system/research-app.service ==="
            cat /etc/systemd/system/research-app.service
            echo "=== ls /root/research-app/ ==="
            ls -la /root/research-app/
            echo "=== python3 -c import flask ==="
            python3 -c "import flask; print(flask.__version__)" 2>&1
            echo "=== python3 -c import anthropic ==="
            python3 -c "import anthropic; print(anthropic.__version__)" 2>&1
            echo "=== systemctl status research-app ==="
            systemctl status research-app --no-pager 2>&1
            echo "=== journalctl -u research-app -n 40 ==="
            journalctl -u research-app --no-pager -n 40 2>&1
            echo "=== Manual test run ==="
            cd /root/research-app && timeout 3 python3 app.py 2>&1
          ' 2>&1) || true
          echo "$DIAG"
          echo "SERVICE_DIAG<<DIAGEOF" >> $GITHUB_ENV
          echo "$DIAG" >> $GITHUB_ENV
          echo "DIAGEOF" >> $GITHUB_ENV

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy diag — $(echo ${{ github.sha }} | cut -c1-7)" \
            --body "$(cat <<ISSUEEOF
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          \`\`\`
          ${SERVICE_DIAG}
          \`\`\`
          ISSUEEOF
          )"
