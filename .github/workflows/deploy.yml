name: Deploy to DigitalOcean

on:
  push:
    branches: [claude/setup-local-test-website-HYAsM, claude/fix-deploy-yaml-syntax-RaWmm]

permissions:
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass

      - name: Setup server dependencies and config
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} bash -s "$ANTHROPIC_API_KEY" << 'REMOTE_SCRIPT'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          API_KEY="$1"

          echo "==> Installing system packages"
          apt-get update -qq
          apt-get install -y -qq nginx python3 python3-pip

          echo "==> Installing Python packages"
          pip3 install --break-system-packages -q flask anthropic

          echo "==> Creating app directories"
          mkdir -p /root/research-app/templates

          echo "==> Writing API key env file"
          printf 'ANTHROPIC_API_KEY=%s\n' "$API_KEY" > /root/.flask-env
          chmod 600 /root/.flask-env

          echo "==> Writing nginx config"
          cat > /etc/nginx/sites-available/default << 'NGINX'
          server {
              listen 80;
              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_http_version 1.1;
                  proxy_buffering off;
                  proxy_cache off;
                  add_header X-Accel-Buffering no;
              }
          }
          NGINX

          echo "==> Writing systemd service"
          cat > /etc/systemd/system/research-app.service << 'SERVICE'
          [Unit]
          Description=NEXUS Research Agent Flask App
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/root/research-app
          EnvironmentFile=/root/.flask-env
          ExecStart=/usr/bin/python3 /root/research-app/app.py
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          SERVICE

          echo "==> Enabling services"
          systemctl daemon-reload
          systemctl enable research-app
          systemctl enable nginx
          systemctl start nginx || systemctl reload nginx
          echo "==> Setup complete"
          REMOTE_SCRIPT

      - name: Deploy app files
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no \
            app.py requirements.txt \
            root@${{ secrets.DO_HOST }}:/root/research-app/
          sshpass -e scp -o StrictHostKeyChecking=no -r \
            templates/ \
            root@${{ secrets.DO_HOST }}:/root/research-app/templates/

      - name: Restart services and verify
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} << 'REMOTE_SCRIPT'
          set -e
          echo "==> Restarting Flask app"
          systemctl restart research-app
          sleep 3
          echo "==> Verifying Flask is active"
          systemctl is-active research-app
          echo "==> Reloading nginx"
          systemctl reload nginx
          echo "==> Health check"
          curl -sf http://localhost:5000/ > /dev/null && echo "App responding OK" || echo "WARNING: app not yet responding"
          REMOTE_SCRIPT

      - name: Report failure as GitHub Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy failed — $(echo ${{ github.sha }} | cut -c1-7)" \
            --body "$(cat <<'ISSUEEOF'
          ## Deploy Failed

          **Commit:** ${{ github.sha }}
          **Run logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check the failing step in the run logs for the exact error.
          ISSUEEOF
          )"
