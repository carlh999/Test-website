name: Deploy to DigitalOcean

on:
  push:
    branches: ['claude/*']

permissions:
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass

      - name: Copy files to server
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "mkdir -p /root/research-app/templates"
          sshpass -e scp -o StrictHostKeyChecking=no deploy/setup.sh root@${{ secrets.DO_HOST }}:/tmp/setup.sh
          sshpass -e scp -o StrictHostKeyChecking=no deploy/install-gemini.sh root@${{ secrets.DO_HOST }}:/tmp/install-gemini.sh
          sshpass -e scp -o StrictHostKeyChecking=no app.py root@${{ secrets.DO_HOST }}:/root/research-app/app.py
          sshpass -e scp -o StrictHostKeyChecking=no requirements.txt root@${{ secrets.DO_HOST }}:/root/research-app/requirements.txt
          sshpass -e scp -o StrictHostKeyChecking=no templates/index.html root@${{ secrets.DO_HOST }}:/root/research-app/templates/index.html

      - name: Run setup
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          set -o pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "chmod +x /tmp/setup.sh && /tmp/setup.sh '${{ secrets.ANTHROPIC_API_KEY }}'" 2>&1 | tee /tmp/setup-output.txt

      - name: Install infsh (nano-banana image gen)
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          set -o pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "chmod +x /tmp/install-gemini.sh && /tmp/install-gemini.sh '${{ secrets.GEMINI_API_KEY }}'" 2>&1 | tee /tmp/gemini-output.txt

      - name: Verify infsh installation
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          set -o pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} "infsh --version" 2>&1 | tee /tmp/verify-output.txt

      - name: Generate background image with infsh
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.DO_PASSWORD }}
        run: |
          set -o pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} bash -s 2>&1 | tee /tmp/nanob-output.txt << 'SCRIPT'
          set -ex
          mkdir -p /root/research-app/static

          # Skip regeneration if image already exists
          if [ -f /root/research-app/static/nexus-bg.png ]; then
            echo "=== nexus-bg.png already exists, skipping generation ==="
            ls -la /root/research-app/static/nexus-bg.png
            exit 0
          fi

          source /root/.gemini-env
          infsh generate \
            --prompt "Dark futuristic AI terminal background, deep black with subtle cyan grid lines forming a perspective grid, glowing cyan data nodes scattered across the grid intersections, faint blue-cyan light traces connecting nodes, dark sci-fi aesthetic, no text, seamless tileable pattern, 1920x1080" \
            --output /root/research-app/static/nexus-bg.png \
            --width 1920 --height 1080

          ls -la /root/research-app/static/nexus-bg.png
          echo "=== BACKGROUND IMAGE GENERATED ==="

          # Restart app so Flask serves the new static file
          systemctl restart research-app
          sleep 3
          systemctl is-active research-app
          SCRIPT

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(cat /tmp/verify-output.txt /tmp/nanob-output.txt /tmp/gemini-output.txt /tmp/setup-output.txt 2>/dev/null | tail -80 || echo "no output captured")
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy log — $(echo ${{ github.sha }} | cut -c1-7)" \
            --body "$(printf '```\n%s\n```' "$BODY")" || true
